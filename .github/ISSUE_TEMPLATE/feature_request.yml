name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, rather than the solution you have in mind.
      placeholder: I track work across five projects and cannot see everything due this week in one place.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project?
      options:
        - Board and tasks
        - Home dashboard and statistics
        - GitHub sync
        - MCP server
        - Appearance, theming or accessibility
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for something similar
          required: true
